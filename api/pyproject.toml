[project]
name = "logos-api"
version = "0.1.0"
description = "API do Logos — central de resposta a incidentes"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.17.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.146.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "pyjwt>=2.15.1",
    "slowapi>=0.1.10",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.14.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
