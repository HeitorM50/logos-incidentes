name: CI

on:
  push:
    branches: [main]
  pull_request:

# O token do GitHub só lê o código: o repositório fica público e nenhum job publica nada.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      # Os testes criam e removem um schema temporário; os dados da aplicação não são tocados.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SEGREDO: segredo-usado-apenas-nos-testes-do-ci
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  web:
    name: Web (lint + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
