name: CI

on:
  push:
    branches: [main]
  pull_request:

# O token do GitHub só lê o código: o repositório fica público e nenhum job publica nada.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      # Os testes criam e removem um schema temporário; os dados da aplicação não são tocados.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # De propósito: sem isto, o conftest recusa banco remoto (proteção contra o api/.env local).
      TESTES_BANCO_REMOTO: "1"
      JWT_SEGREDO: segredo-usado-apenas-nos-testes-do-ci
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  web:
    name: Web (lint + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: Ponta a ponta (Playwright)
    runs-on: ubuntu-latest
    # Banco descartável só para este job: a produção nunca é tocada.
    services:
      banco:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: logos
          POSTGRES_PASSWORD: logos
          POSTGRES_DB: logos
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U logos -d logos"
          --health-interval 2s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://logos:logos@localhost:55432/logos
      JWT_SEGREDO: segredo-usado-apenas-nos-testes-ponta-a-ponta
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: API (dependências, migrations e dados de demonstração)
        working-directory: api
        run: |
          uv sync --locked
          uv run alembic upgrade head
          uv run python -m app.seed
      - name: Front (dependências e build apontando para a API local)
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Navegador do Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium
      # O Playwright sobe a API (uvicorn) e o front (vite preview) sozinho (playwright.config.ts).
      - name: Testes ponta a ponta
        working-directory: web
        run: npx playwright test
      - name: Relatório e traces em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
