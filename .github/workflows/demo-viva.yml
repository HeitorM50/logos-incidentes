name: Demonstração viva

# O avaliador pode abrir o Logos dias depois da entrega. Sem isto, os incidentes de demonstração
# envelhecem: quase todos aparecem como atrasados e o relatório das últimas 6 h fica vazio.
#
# - Todo dia às 06:00 (Brasília), os dados de demonstração são recriados (seed --recriar).
# - A cada 30 min, a central de rastreamento simulada manda 1 min de telemetria da frota
#   (scripts/simular_frota.py): posições e sensores; a API abre incidentes pelas regras.
on:
  schedule:
    - cron: "0 9 * * *"
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      acao:
        description: O que fazer agora
        type: choice
        options: [caminhao, recriar]
        default: caminhao

# O token do GitHub só lê o código: nenhum job publica nada no repositório.
permissions:
  contents: read

# Recriar e enviar não rodam juntos: o envio das 06:00 espera a recriação terminar.
concurrency:
  group: demo-viva
  cancel-in-progress: false

jobs:
  recriar:
    name: Recriar os dados de demonstração
    if: github.event.schedule == '0 9 * * *' || inputs.acao == 'recriar'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # O seed não assina tokens, mas a configuração da API exige o campo.
      JWT_SEGREDO: segredo-que-o-seed-nao-usa-0123456789abcdef
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python -m app.seed --recriar

  caminhao:
    name: Telemetria da frota
    if: github.event.schedule == '*/30 * * * *' || inputs.acao == 'caminhao'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      # 1 min de telemetria (4 envios): os 70 caminhões andam nas rodovias e a API abre os
      # incidentes que as regras apontarem (pânico, impacto, motor quente, visibilidade, parada).
      - name: Enviar a telemetria da frota
        run: uv run python scripts/simular_frota.py --api "${{ vars.API_URL }}" --duracao 60
