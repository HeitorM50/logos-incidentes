name: Manter ativo

# O plano gratuito do Render hiberna a API após ~15 min sem tráfego, e o Supabase pausa projetos
# sem uso. Esta chamada periódica a /health mantém os dois acordados (ADR 0006).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.API_URL != '' }}
    steps:
      - name: Chamar /health
        run: curl --fail --silent --show-error --max-time 90 --retry 2 "${{ vars.API_URL }}/health"
