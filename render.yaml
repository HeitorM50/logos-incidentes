# Blueprint do Render para a API (https://render.com/docs/blueprint-spec).
services:
  - type: web
    name: logos-api
    runtime: python
    plan: free
    region: virginia
    rootDir: api
    buildCommand: pip install uv && uv sync --locked --no-dev
    # Migrations e seed idempotente rodam a cada deploy (o plano free não tem pre-deploy).
    # --proxy-headers faz o rate limit usar o IP real do cliente, não o do proxy do Render.
    startCommand: >-
      uv run --no-dev alembic upgrade head &&
      uv run --no-dev python -m app.seed &&
      uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port $PORT
      --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGENS
        sync: false
      - key: JWT_SEGREDO
        generateValue: true
      - key: SIMULAR_LATENCIA_MS
        value: "0"
      - key: SIMULAR_FALHA_PCT
        value: "0"
