# Blueprint do Render para a API (https://render.com/docs/blueprint-spec).
services:
  - type: web
    name: logos-api
    runtime: python
    plan: free
    region: virginia
    rootDir: api
    buildCommand: pip install uv && uv sync --locked --no-dev
    # Migrations e seed idempotente rodam a cada deploy (o plano free não tem pre-deploy).
    # O limite de login por IP usa o CF-Connecting-IP da Cloudflare (app/core/limite.py); o
    # X-Forwarded-For pode ser forjado pelo cliente.
    startCommand: >-
      uv run --no-dev alembic upgrade head &&
      uv run --no-dev python -m app.seed &&
      uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port $PORT
      --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGENS
        sync: false
      - key: JWT_SEGREDO
        generateValue: true
      - key: SIMULAR_LATENCIA_MS
        value: "0"
      - key: SIMULAR_FALHA_PCT
        value: "0"
      # Sugestão pela IA (ADR 0014): sem a chave, o recurso fica desligado.
      - key: ANTHROPIC_API_KEY
        sync: false
